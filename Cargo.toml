[workspace]
members = [
    "src/core",
    "src/notifier-feishu",
    "src/plugin-getllm",
    "src/runtime",
    "src/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kiwilab"]
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.99"
argus-core = { path = "src/core" }
argus-notifier-feishu = { path = "src/notifier-feishu" }
argus-plugin-getllm = { path = "src/plugin-getllm" }
argus-runtime = { path = "src/runtime" }
async-trait = "0.1.89"
clap = { version = "4.5.45", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = "2.5.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
